# Konfiguracja systemu Windows_CCounter

sensor:
  # Wybór backendu sprzętowego:
  # - "automationhat" = wariant zalecany / docelowy
  # - "gpio" = wariant alternatywny
  hardware_backend: "automationhat"
  # hardware_backend: "gpio"
  
  # Ustawienia dla bezpośredniego GPIO (tylko gdy hardware_backend="gpio")
  gpio_pin: 17              # Numer pinu GPIO dla czujnika indukcyjnego
  pull_up: true             # Włącz wewnętrzny pull-up rezystor
  
  # Ustawienia dla Automation HAT Mini (tylko gdy hardware_backend="automationhat")
  automation_hat_input: "one"  # Które wejście HAT: "one", "two" lub "three"
  
  # Wspólne ustawienia
  debounce_ms: 50           # Czas debouncingu w milisekundach
  active_low: true          # Czujnik aktywny stanem niskim (NPN)
  simulation_mode: false    # Ustaw true do testów bez fizycznego wejścia

data:
  data_dir: "./data"           # Katalog na pliki sesji (session_*.csv)
  backup_enabled: true
  backup_path: "./data/backup/"
  max_records_in_memory: 1000

api:
  host: "0.0.0.0"
  port: 8000
  enable_cors: true

gui:
  enabled: true
  fullscreen: false          # Ustaw na true dla produkcji
  window_width: 800
  window_height: 480        # Rozdzielczość ekranu dotykowego
  refresh_interval_ms: 500

web:
  enabled: true             # Włącz interfejs webowy NiceGUI
  host: "0.0.0.0"
  port: 8080                # Port dla Web UI (osobny od FastAPI)

usb:
  mount_path: "/media/usb"  # Ścieżka montowania pendrive na Linux
  auto_detect: true

logging:
  level: "INFO"
  file: "./logs/system.log"
